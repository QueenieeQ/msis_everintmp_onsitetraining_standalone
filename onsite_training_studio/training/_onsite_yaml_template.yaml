        definition: Maximum additive brightness bias
        Min: -100
        Max: 100
        Default: 18
        Best: 18
        Step: 1
        Current: 18
    translate:
      frac_x:
        name: Translate Fraction X
        access: msislab
        definition: Max horizontal shift as a fraction of image width
        Min: 0.0
        Max: 0.5
        Default: 0.1
        Best: 0.1
        Step: 0.01
        Current: 0.1
      frac_y:
        name: Translate Fraction Y
        access: msislab
        definition: Max vertical shift as a fraction of image height
        Min: 0.0
        Max: 0.5
        Default: 0.1
        Best: 0.1
        Step: 0.01
        Current: 0.1
    rotate:
      deg_min:
        name: Rotate Degrees Min
        access: msislab
        definition: Minimum rotation angle in degrees
        Min: -180
        Max: 180
        Default: -12
        Best: -12
        Step: 1
        Current: -12
      deg_max:
        name: Rotate Degrees Max
        access: msislab
        definition: Maximum rotation angle in degrees
        Min: -180
        Max: 180
        Default: 12
        Best: 12
        Step: 1
        Current: 12
    scale:
      min:
        name: Scale Min
        access: msislab
        definition: Minimum scale factor
        Min: 0.1
        Max: 3.0
        Default: 0.85
        Best: 0.85
        Step: 0.05
        Current: 0.85
      max:
        name: Scale Max
        access: msislab
        definition: Maximum scale factor
        Min: 0.1
        Max: 3.0
        Default: 1.2
        Best: 1.2
        Step: 0.05
        Current: 1.2
    shear:
      shx_min:
        name: Shear X Min
        access: msislab
        definition: Minimum horizontal shear factor
        Min: -1.0
        Max: 1.0
        Default: -0.08
        Best: -0.08
        Step: 0.01
        Current: -0.08
      shx_max:
        name: Shear X Max
        access: msislab
        definition: Maximum horizontal shear factor
        Min: -1.0
        Max: 1.0
        Default: 0.08
        Best: 0.08
        Step: 0.01
        Current: 0.08
      shy_min:
        name: Shear Y Min
        access: msislab
        definition: Minimum vertical shear factor
        Min: -1.0
        Max: 1.0
